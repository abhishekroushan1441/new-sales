<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Orders</title>
<meta name="theme-color" content="#f6f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17110d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Café Orders. Warm paper + espresso palette, light and dark. Phones: tabs move to a bottom bar, cart is a bottom sheet. */
:root{
  --bg:#f6f0e8; --surface:#fffdf9; --raised:#ffffff; --ink:#2a1d14; --muted:#86725f; --line:#eadfd2; --soft:#f3ebe0;
  --brand:#5b3420; --brand-ink:#fff8f0; --brand-soft:#f2e3d4; --accent:#c8743a; --accent-soft:#f8e5d3;
  --new:#2f5bd3; --new-soft:#e6ecfc; --prep:#b4610c; --prep-soft:#fbecd8; --ready:#1d7a44; --ready-soft:#e1f2e7;
  --done:#7b7068; --done-soft:#efebe6; --bad:#bf2f22; --bad-soft:#fbe6e3;
  --shadow:0 1px 2px rgba(60,35,15,.06),0 4px 14px rgba(60,35,15,.06);
  --shadow-lg:0 -10px 40px rgba(40,20,5,.22);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17110d; --surface:#211913; --raised:#2a2019; --ink:#f4e9dc; --muted:#b09a85; --line:#3a2d23; --soft:#2c221b;
  --brand:#e3b48a; --brand-ink:#24170e; --brand-soft:#3b2b1f; --accent:#e89a5c; --accent-soft:#3d2a1b;
  --new:#8fb0ff; --new-soft:#1f2a45; --prep:#f0ac5e; --prep-soft:#3c2b17; --ready:#6fd39a; --ready-soft:#183323;
  --done:#a89c92; --done-soft:#2e2722; --bad:#ff8a7d; --bad-soft:#3e1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17110d; --surface:#211913; --raised:#2a2019; --ink:#f4e9dc; --muted:#b09a85; --line:#3a2d23; --soft:#2c221b;
  --brand:#e3b48a; --brand-ink:#24170e; --brand-soft:#3b2b1f; --accent:#e89a5c; --accent-soft:#3d2a1b;
  --new:#8fb0ff; --new-soft:#1f2a45; --prep:#f0ac5e; --prep-soft:#3c2b17; --ready:#6fd39a; --ready-soft:#183323;
  --done:#a89c92; --done-soft:#2e2722; --bad:#ff8a7d; --bad-soft:#3e1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 -10px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);font-size:16px}
h1,h2,h3{text-wrap:balance}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{max-width:1240px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{flex:none;width:38px;height:38px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1.2rem}
.brand h1{margin:0;font-family:var(--serif);font-size:1.3rem;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
nav{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px}
nav button{position:relative;border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
nav button svg{width:18px;height:18px;flex:none}
nav button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
nav .count{min-width:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;line-height:19px;text-align:center}

main{max-width:1240px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 15px;font-weight:600;min-height:42px;transition:background .15s,border-color .15s,transform .06s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);min-height:0;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;margin:0}
.title{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}

/* new order */
.order{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.order > div{min-width:0}
.sticky-tools{position:sticky;top:var(--hdr,63px);z-index:10;background:var(--bg);margin:-18px 0 0;padding:14px 0 6px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:12px 14px 12px 40px;box-shadow:var(--shadow)}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.88rem;white-space:nowrap;display:flex;gap:6px;align-items:center;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat{display:flex;align-items:baseline;gap:8px;margin:18px 0 10px;font-family:var(--serif);font-size:1.12rem;font-weight:700}
.cat small{font-family:var(--f);font-size:.78rem;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.item{position:relative;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:12px;min-height:112px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .15s,background .15s,transform .08s}
.item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item:active{transform:scale(.97)}
.item .ico{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:1.3rem;line-height:1}
.item b{font-weight:650;line-height:1.25;font-size:.95rem}
.item .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:28px}
.item .price{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums;font-weight:600}
.item .nr{color:var(--prep);font-size:.72rem;font-weight:600}
.item .add{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:1.1rem;font-weight:700;line-height:1}
.item.in{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--raised))}
.item.in .add{background:var(--accent);color:#fff;font-size:.82rem;min-width:28px;width:auto;padding:0 8px;border-radius:99px}

.cart{position:sticky;top:calc(var(--hdr,63px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;max-height:calc(100vh - var(--hdr,63px) - 32px);box-shadow:var(--shadow)}
.grab{display:none}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px}
.cart-head h2{margin:0;font-family:var(--serif);font-size:1.25rem}
.lines{overflow:auto;padding:0 18px;flex:1;overscroll-behavior:contain}
.lines .empty{padding:26px 8px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.line .n{font-weight:650;min-width:0;align-self:center}
.line .p{grid-column:1;color:var(--muted);font-size:.84rem}
.stepper{grid-row:1/3;grid-column:2;display:flex;align-items:center;background:var(--soft);border-radius:99px;padding:3px;align-self:center}
.stepper button{border:0;background:var(--raised);width:32px;height:32px;border-radius:50%;font-size:1.1rem;box-shadow:var(--shadow);display:grid;place-items:center}
.stepper span{min-width:30px;text-align:center;font-weight:700;font-family:var(--mono);font-size:.95rem}
.line .notebtn{grid-column:1;justify-self:start;border:0;background:none;padding:2px 0;color:var(--accent);font-size:.82rem;font-weight:600}
.line input.note{grid-column:1/3;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--raised)}
.form{padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:0 0 20px 20px}
.form label{font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.form input,.form textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raised);width:100%}
.form textarea{resize:vertical;min-height:44px}
.seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.place{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 18px;font-size:1rem;border-radius:14px;min-height:52px}
.err{color:var(--bad);font-size:.88rem;margin:0}
.mobilebar{display:none}

.done{max-width:560px;margin:10px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.done .tick{width:52px;height:52px;border-radius:50%;background:var(--ready-soft);color:var(--ready);display:grid;place-items:center}
.done .tick svg{width:26px;height:26px}
.done h2{margin:14px 0 4px;font-family:var(--serif);font-size:1.6rem}
.done .id{font-family:var(--mono);font-size:.95rem}
.done .row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.done .row .btn{flex:1 1 160px}
.disconnect{display:block;margin:36px auto 0;border:0;background:none;color:var(--muted);font-size:.82rem;text-decoration:underline}
.warn{background:var(--prep-soft);color:var(--prep);border-radius:12px;padding:10px 12px;font-size:.88rem;margin:12px 0 0}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto;background:var(--raised);border:1px solid var(--line);border-radius:14px}
tr.group td{background:var(--soft);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* orders board */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters input[type=date]{border:1px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--raised);min-height:42px}
.filters .seg{flex:0 1 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ocard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 16px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);overflow:hidden}
.ocard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--st,var(--done))}
.ocard.s-New{--st:var(--new)} .ocard.s-Preparing{--st:var(--prep)} .ocard.s-Ready{--st:var(--ready)} .ocard.s-Completed{--st:var(--done)} .ocard.s-Cancelled{--st:var(--bad);opacity:.8}
.ocard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ocard .oid{font-family:var(--mono);font-size:.8rem}
.ocard .who{font-family:var(--serif);font-weight:700;font-size:1.2rem;line-height:1.2}
.ocard .meta{color:var(--muted);font-size:.82rem}
.ocard ul{margin:0;padding:10px 12px;list-style:none;background:var(--soft);border-radius:12px;display:flex;flex-direction:column;gap:4px}
.ocard li{display:flex;gap:8px;align-items:baseline}
.ocard li .q{font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--accent);min-width:26px}
.ocard li small{color:var(--muted)}
.ocard .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.ocard .actions .btn{flex:1 1 auto}
.ocard details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.86rem;list-style:none}
.ocard details summary::-webkit-details-marker{display:none}
.ocard details summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.ocard details[open] summary::before{transform:rotate(90deg)}
.ocard details table{font-size:.82rem;margin-top:6px}
.ocard details td{padding:5px 4px}
.pill{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.s-New{background:var(--new-soft);color:var(--new)} .pill.s-Preparing{background:var(--prep-soft);color:var(--prep)}
.pill.s-Ready{background:var(--ready-soft);color:var(--ready)} .pill.s-Completed{background:var(--done-soft);color:var(--done)}
.pill.s-Cancelled{background:var(--bad-soft);color:var(--bad)}

/* usage */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;align-items:start}
h3{margin:0 0 10px;font-family:var(--serif);font-size:1.12rem}
.filters label.muted{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--nav-h) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:.92rem;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:40px 0;justify-content:center}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.item,.cart,.btn{transition:none!important}}

@media (max-width:900px){
  .order{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;inset:auto 0 0 0;top:auto;max-height:90vh;border-radius:24px 24px 0 0;border-bottom:0;z-index:45;box-shadow:var(--shadow-lg);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  .cart.open{transform:none}
  .form{border-radius:0}
  .grab{display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0;border:0;padding:0}
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:var(--nav-h);z-index:30;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));pointer-events:none}
  .mobilebar .btn{pointer-events:auto;width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:1rem;border-radius:16px;min-height:54px;box-shadow:0 8px 24px rgba(40,20,5,.28)}
  .mobilebar .btn:disabled{opacity:1;background:var(--surface);color:var(--muted);border-color:var(--line);box-shadow:var(--shadow)}
  .shade{position:fixed;inset:0;background:rgba(20,10,4,.42);z-index:40}
  .two{grid-template-columns:1fr}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
}
@media (max-width:700px){
  :root{--nav-h:calc(64px + env(safe-area-inset-bottom))}
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .bar{padding-top:10px;padding-bottom:10px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:35;border-radius:0;border:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:0}
  nav button{flex:1;flex-direction:column;gap:3px;padding:6px 4px;font-size:.72rem;border-radius:12px}
  nav button svg{width:22px;height:22px}
  nav button[aria-selected="true"]{background:none;box-shadow:none;color:var(--brand)}
  nav button[aria-selected="true"] svg{background:var(--brand-soft);border-radius:99px;padding:3px 14px;width:52px;height:28px;box-sizing:border-box}
  nav .count{position:absolute;top:2px;left:calc(50% + 10px)}
  .chips{margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #v-usage .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #v-usage .filters .seg{grid-column:1/-1;order:-1}
  #v-usage .filters label.muted{flex-direction:column;align-items:stretch;gap:4px}
  #v-usage .filters input[type=date]{width:100%}
  #v-usage .filters #uCopy{grid-column:1/-1}
  .item{min-height:104px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .filters .seg{order:3;flex:1 1 100%;overflow-x:auto}
  .filters input[type=date]{flex:1 1 auto}
  .done{padding:22px 18px}
  .stat{padding:12px}
  .stat b{font-size:1.5rem}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="mark" id="mark">C</div><div><h1 id="shop">Café Orders</h1><small id="today"></small></div></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-view="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New order</span></button>
      <button role="tab" aria-selected="false" data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10"/><circle cx="4.5" cy="5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="19" r="1"/></svg><span>Orders</span><span class="count" id="activeCount" hidden>0</span></button>
      <button role="tab" aria-selected="false" data-view="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Ingredients</span></button>
    </nav>
  </div>
</header>

<main>
  <!-- NEW ORDER -->
  <section id="v-new">
    <div class="loading" id="menuLoading"><div class="spin"></div>Loading menu…</div>
    <form class="done" id="connectUI" hidden autocomplete="off">
      <h2 class="title" style="margin-top:0">Connect this device</h2>
      <p class="muted">Open the setup link from your manager on this device, or paste the details here. This is needed only once per device.</p>
      <div class="form" style="padding:0;border:0">
        <label>Web app URL <input id="cUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required></label>
        <label>API key (write) <input id="cKey" type="text" placeholder="ck_w_…" required></label>
        <p class="err" id="cErr" hidden></p>
        <button class="btn primary place" id="cBtn" type="submit"><span>Connect</span><span></span></button>
      </div>
    </form>
    <div class="order" id="orderUI" hidden>
      <div>
        <div class="sticky-tools">
          <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="search" type="search" placeholder="Search the menu" autocomplete="off" aria-label="Search the menu"></div>
          <div class="chips" id="cats"></div>
        </div>
        <div id="menu"></div>
      </div>
      <aside class="cart" id="cart" aria-label="Current order">
        <button class="grab" id="grab" type="button" aria-label="Close order"></button>
        <div class="cart-head"><h2 id="cartTitle">Current order</h2><button class="btn ghost" id="clearBtn" type="button">Clear</button></div>
        <div class="lines" id="lines"></div>
        <div class="form">
          <label>Customer name <input id="customer" type="text" maxlength="80" placeholder="Optional" autocomplete="off"></label>
          <div class="seg" id="types" role="group" aria-label="Order type"></div>
          <label>Order notes <textarea id="notes" rows="1" maxlength="500" placeholder="Optional"></textarea></label>
          <p class="err" id="placeErr" hidden></p>
          <button class="btn primary place" id="placeBtn" type="button" disabled><span id="placeLabel">Place order</span><span id="placeTotal"></span></button>
        </div>
      </aside>
    </div>
    <div class="done" id="doneUI" hidden>
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Order placed</h2>
      <div class="id" id="doneId"></div>
      <p class="muted" id="doneSummary"></p>
      <p class="warn" id="doneWarn" hidden></p>
      <div class="row"><button class="btn primary" id="newBtn" type="button">New order</button><button class="btn" id="toOrdersBtn" type="button">See orders</button></div>
      <h3 style="margin-top:22px">Ingredients recorded</h3>
      <div class="tablewrap"><table><thead><tr><th>Ingredient</th><th>For</th><th class="num">Amount</th></tr></thead><tbody id="doneCons"></tbody></table></div>
    </div>
  </section>

  <!-- ORDERS -->
  <section id="v-orders" hidden>
    <div class="filters">
      <input type="date" id="oDate" aria-label="Day">
      <div class="seg" id="oFilter" role="group" aria-label="Show">
        <button type="button" data-f="active" aria-pressed="true">Active</button>
        <button type="button" data-f="Completed" aria-pressed="false">Completed</button>
        <button type="button" data-f="Cancelled" aria-pressed="false">Cancelled</button>
        <button type="button" data-f="all" aria-pressed="false">All</button>
      </div>
      <button class="btn" id="oRefresh" type="button">Refresh</button>
    </div>
    <div id="oList"></div>
  </section>

  <!-- USAGE -->
  <section id="v-usage" hidden>
    <div class="filters">
      <label class="muted">From <input type="date" id="uFrom"></label>
      <label class="muted">To <input type="date" id="uTo"></label>
      <div class="seg" id="uQuick"><button type="button" data-q="0">Today</button><button type="button" data-q="1">Yesterday</button><button type="button" data-q="7">Last 7 days</button></div>
      <button class="btn" id="uCopy" type="button">Copy as CSV</button>
    </div>
    <div id="uBody"></div>
  </section>
  <button class="disconnect" id="disconnectBtn" type="button" hidden>Disconnect this device</button>
</main>

<div class="mobilebar" id="mobileBar"><button class="btn primary" id="reviewBtn" type="button" disabled><span id="reviewLabel">No items yet</span><span id="reviewTotal"></span></button></div>
<div class="shade" id="shade" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
// When served by Apps Script the page talks to the sheet directly. Hosted anywhere else (e.g. GitHub Pages)
// it needs the web app URL and a write key. Those are never stored in the code: each device connects once,
// from a setup link (…#api=<web app URL>&key=<write key>) or the Connect form, and keeps them in this browser.
var IN_GAS = !!(window.google && google.script && google.script.run);
var STORE = 'cafe_orders_connection';
function savedConn(){ try{ return JSON.parse(localStorage.getItem(STORE) || 'null') || {}; }catch(e){ return {}; } }
(function readSetupLink(){
  var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('api') && h.get('key')){
    try{ localStorage.setItem(STORE, JSON.stringify({ API_URL:h.get('api'), API_KEY:h.get('key') })); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){ location.hash = ''; }
  }
})();
var CONFIG = Object.assign({ API_URL:'', API_KEY:'' }, savedConn(), window.ORDER_CONFIG || {});
var $ = function(id){ return document.getElementById(id); };

/* ---------- talking to the sheet ---------- */
function call(action, data){
  var req = Object.assign({ action: action }, data || {});
  if (IN_GAS) {
    return new Promise(function(res, rej){ google.script.run.withSuccessHandler(res).withFailureHandler(rej).web(req); });
  }
  if (!CONFIG.API_URL) return Promise.reject(new Error('This device isn’t connected yet'));
  req.key = CONFIG.API_KEY;
  var write = action === 'createOrder' || action === 'updateStatus';
  var url = CONFIG.API_URL;
  var opts;
  if (write) opts = { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(req) };
  else { url += (url.indexOf('?') < 0 ? '?' : '&') + Object.keys(req).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(req[k]); }).join('&'); opts = {}; }
  return fetch(url, opts).then(function(r){ return r.json(); });
}

/* ---------- helpers ---------- */
var shop = { currency:'$', orderTypes:['Dine-in','Takeout','Pickup'], statuses:[] };
var menu = [], cart = [], ref = '', orderType = '';
function money(n){ return n === null || n === undefined ? '' : shop.currency + Number(n).toFixed(2); }
function num(n){ var r = Math.round(n * 1000) / 1000; return String(r); }
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function uuid(){ return 'w-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
var toastT;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2600); }
function ymd(d){ var p = function(x){ return String(x).padStart(2,'0'); }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function timeOf(iso){ return iso ? new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : ''; }
function loading(){ var d = el('div','loading'); d.appendChild(el('div','spin')); d.appendChild(document.createTextNode('Loading…')); return d; }

/* ---------- tabs ---------- */
var view = 'new';
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ show(b.dataset.view); };
});
function show(v){
  view = v;
  document.querySelectorAll('nav button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.view === v)); });
  ['new','orders','usage'].forEach(function(x){ $('v-'+x).hidden = x !== v; });
  $('mobileBar').hidden = v !== 'new' || !$('doneUI').hidden;
  if (v === 'orders') loadOrders();
  if (v === 'usage') loadUsage();
}

/* ---------- menu ---------- */
var activeCat = 'All';
var ICONS = [[/rtd|soda|bottle|can/i,'🥤'],[/drink|coffee|tea|beverage/i,'☕'],[/sweet|dessert|pastr|cake/i,'🥐'],[/savou?ry|empanada/i,'🥟'],
  [/breakfast/i,'🍳'],[/sandwich/i,'🥪'],[/bread|bake/i,'🍞'],[/salad/i,'🥗'],[/juice|smoothie/i,'🧃']];
function iconFor(cat, item){
  var t = (item || '') + ' ' + cat;
  if (/water/i.test(item || '')) return '💧';
  if (/juice/i.test(item || '')) return '🧃';
  if (/tea\b/i.test(item || '')) return '🍵';
  if (/iced/i.test(item || '')) return '🧊';
  if (/croissant/i.test(item || '')) return '🥐';
  if (/cinnamon/i.test(item || '')) return '🌀';
  if (/arepa|bono|almojabana/i.test(item || '')) return '🫓';
  for (var i = 0; i < ICONS.length; i++) if (ICONS[i][0].test(cat)) return ICONS[i][1];
  for (var j = 0; j < ICONS.length; j++) if (ICONS[j][0].test(t)) return ICONS[j][1];
  return '🍽️';
}
function catIcon(c){ for (var i = 0; i < ICONS.length; i++) if (ICONS[i][0].test(c)) return ICONS[i][1]; return '🍽️'; }
function loadMenu(){
  call('menu').then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Could not load the menu');
    shop = r; menu = r.items; $('connectUI').hidden = true;
    $('shop').textContent = r.shop; document.title = r.shop;
    $('mark').textContent = (r.shop || 'C').trim().charAt(0).toUpperCase();
    orderType = r.orderTypes[0] || '';
    renderTypes(); renderCats(); renderMenu(); renderCart();
    $('menuLoading').hidden = true; $('orderUI').hidden = false;
  }).catch(function(e){
    var msg = String(e && e.message || e);
    if (!IN_GAS && /key|connected/i.test(msg)) return showConnect(msg);
    $('menuLoading').textContent = 'Couldn’t load the menu: ' + msg + '. Check the connection and reload.';
  });
}
function renderCats(){
  var cats = ['All'];
  menu.forEach(function(m){ if (cats.indexOf(m.category) < 0) cats.push(m.category); });
  var box = $('cats'); box.innerHTML = '';
  cats.forEach(function(c){
    var b = el('button','chip'); b.type = 'button'; if (c !== 'All') b.appendChild(el('span','',catIcon(c))); b.appendChild(el('span','',c)); b.setAttribute('aria-pressed', String(c === activeCat));
    b.onclick = function(){ activeCat = c; renderCats(); renderMenu(); };
    box.appendChild(b);
  });
}
function renderMenu(){
  var q = $('search').value.trim().toLowerCase();
  var list = menu.filter(function(m){ return (activeCat === 'All' || m.category === activeCat) && (!q || m.item.toLowerCase().indexOf(q) >= 0 || m.category.toLowerCase().indexOf(q) >= 0); });
  var box = $('menu'); box.innerHTML = '';
  if (!list.length){ box.appendChild(el('p','empty', q ? 'Nothing matches “' + q + '”.' : 'No items in this category.')); return; }
  var groups = {};
  list.forEach(function(m){ (groups[m.category] = groups[m.category] || []).push(m); });
  Object.keys(groups).forEach(function(cat){
    if (activeCat === 'All' || q){ var h = el('div','cat',cat); h.appendChild(el('small','',String(groups[cat].length))); box.appendChild(h); }
    var grid = el('div','grid');
    groups[cat].forEach(function(m){
      var inCart = cart.filter(function(l){ return l.item === m.item; }).reduce(function(s,l){ return s + l.qty; }, 0);
      var b = el('button','item' + (inCart ? ' in' : '')); b.type = 'button';
      b.setAttribute('aria-label', 'Add ' + m.item + (inCart ? ' (' + inCart + ' in order)' : ''));
      b.appendChild(el('span','ico',iconFor(m.category, m.item)));
      b.appendChild(el('b','',m.item));
      var foot = el('span','foot'), info = el('span','');
      if (m.price !== null) info.appendChild(el('span','price',money(m.price)));
      if (!m.hasRecipe) info.appendChild(el('span','nr', (m.price !== null ? ' · ' : '') + 'no recipe yet'));
      foot.appendChild(info);
      foot.appendChild(el('span', inCart ? 'add inc' : 'add', inCart ? '×' + inCart : '+'));
      b.appendChild(foot);
      b.onclick = function(){ add(m); };
      grid.appendChild(b);
    });
    box.appendChild(grid);
  });
}
$('search').oninput = renderMenu;

/* ---------- cart ---------- */
function add(m){
  if (!cart.length) ref = uuid();
  var line = cart.filter(function(l){ return l.item === m.item && !l.note; })[0];
  if (line) line.qty = Math.min(999, line.qty + 1); else cart.push({ item:m.item, price:m.price, qty:1, note:'' });
  renderCart(); renderMenu();
}
function total(){
  if (!cart.length || cart.some(function(l){ return l.price === null; })) return null;
  return cart.reduce(function(s,l){ return s + l.price * l.qty; }, 0);
}
function count(){ return cart.reduce(function(s,l){ return s + l.qty; }, 0); }
function renderCart(){
  var box = $('lines'), focusMe = null; box.innerHTML = '';
  if (!cart.length) box.appendChild(el('p','empty','Tap items on the menu to add them.'));
  cart.forEach(function(l, i){
    var row = el('div','line');
    row.appendChild(el('div','n',l.item));
    var st = el('div','stepper');
    var minus = el('button','', '−'); minus.type='button'; minus.setAttribute('aria-label','One less ' + l.item);
    var plus = el('button','', '+'); plus.type='button'; plus.setAttribute('aria-label','One more ' + l.item);
    minus.onclick = function(){ l.qty -= 1; if (l.qty < 1) cart.splice(i,1); renderCart(); renderMenu(); };
    plus.onclick = function(){ l.qty = Math.min(999, l.qty + 1); renderCart(); renderMenu(); };
    st.appendChild(minus); st.appendChild(el('span','',String(l.qty))); st.appendChild(plus);
    row.appendChild(st);
    if (l.price !== null) row.appendChild(el('div','p', money(l.price * l.qty)));
    if (l.noteOpen || l.note){
      var inp = el('input','note'); inp.type='text'; inp.maxLength=200; inp.placeholder='Note, e.g. oat milk, no onions'; inp.value=l.note;
      inp.oninput = function(){ l.note = inp.value; };
      row.appendChild(inp);
      if (l.noteOpen && !l.note) focusMe = inp;
      l.noteOpen = false;
    } else {
      var nb = el('button','notebtn','+ Add note'); nb.type='button'; nb.onclick = function(){ l.noteOpen = true; renderCart(); };
      row.appendChild(nb);
    }
    box.appendChild(row);
  });
  if (focusMe) focusMe.focus();
  var t = total(), n = count();
  $('placeBtn').disabled = !n;
  $('placeLabel').textContent = n ? 'Place order · ' + n + ' item' + (n === 1 ? '' : 's') : 'Place order';
  $('placeTotal').textContent = t === null ? '' : money(t);
  $('cartTitle').textContent = n ? 'Current order · ' + n : 'Current order';
  $('reviewBtn').disabled = !n;
  $('reviewLabel').textContent = n ? 'Review order · ' + n + ' item' + (n === 1 ? '' : 's') : 'No items yet';
  $('reviewTotal').textContent = t === null ? '' : money(t);
  if (!n) closeSheet();
}
function renderTypes(){
  var box = $('types'); box.innerHTML = '';
  shop.orderTypes.forEach(function(t){
    var b = el('button','',t); b.type='button'; b.setAttribute('aria-pressed', String(t === orderType));
    b.onclick = function(){ orderType = t; renderTypes(); };
    box.appendChild(b);
  });
}
var clearArm = false;
$('clearBtn').onclick = function(){
  if (!cart.length) return;
  if (!clearArm){ clearArm = true; $('clearBtn').textContent = 'Tap to clear'; setTimeout(function(){ clearArm = false; $('clearBtn').textContent = 'Clear'; }, 3000); return; }
  clearArm = false; $('clearBtn').textContent = 'Clear';
  resetOrder();
};
function resetOrder(){
  cart = []; ref = ''; $('customer').value = ''; $('notes').value = ''; $('placeErr').hidden = true;
  orderType = shop.orderTypes[0] || ''; renderTypes(); renderCart(); renderMenu();
}
function openSheet(){ $('cart').classList.add('open'); $('shade').hidden = false; }
function closeSheet(){ $('cart').classList.remove('open'); $('shade').hidden = true; }
$('reviewBtn').onclick = openSheet;
$('shade').onclick = closeSheet;
$('grab').onclick = closeSheet;
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
function setHdr(){ document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', setHdr); setHdr();

/* ---------- place order ---------- */
$('placeBtn').onclick = function(){
  if (!cart.length) return;
  var b = $('placeBtn'); b.disabled = true; $('placeLabel').textContent = 'Placing…'; $('placeErr').hidden = true;
  call('createOrder', {
    ref: ref, customer: $('customer').value.trim(), type: orderType, notes: $('notes').value.trim(),
    items: cart.map(function(l){ return { item:l.item, qty:l.qty, note:l.note.trim() }; })
  }).then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Order not placed');
    showDone(r);
    resetOrder(); closeSheet();
    refreshCount();
  }).catch(function(e){
    $('placeErr').textContent = (e.message || e) + '. Your order is still here; tap Place order to try again.';
    $('placeErr').hidden = false; renderCart();
  });
};
function showDone(r){
  var o = r.order;
  $('doneId').textContent = o.id + (o.customer ? ' · ' + o.customer : '') + ' · ' + o.type;
  $('doneSummary').textContent = o.summary + (o.total !== null ? ' · ' + money(o.total) : '');
  $('doneWarn').hidden = !r.warning; $('doneWarn').textContent = r.warning || '';
  var tb = $('doneCons'); tb.innerHTML = '';
  (o.constituents || []).forEach(function(c){
    var tr = el('tr');
    tr.appendChild(el('td','',c.material));
    tr.appendChild(el('td','muted',c.itemQty + '× ' + c.item));
    tr.appendChild(el('td','num',num(c.total) + ' ' + c.unit));
    tb.appendChild(tr);
  });
  if (!(o.constituents || []).length){ var tr = el('tr'); var td = el('td','muted','No recipes found for these items.'); td.colSpan = 3; tr.appendChild(td); tb.appendChild(tr); }
  if (r.duplicate) toast('This order was already saved');
  $('orderUI').hidden = true; $('doneUI').hidden = false; $('mobileBar').hidden = true;
  window.scrollTo(0,0);
}
$('newBtn').onclick = function(){ $('doneUI').hidden = true; $('orderUI').hidden = false; $('mobileBar').hidden = false; };
$('toOrdersBtn').onclick = function(){ $('doneUI').hidden = true; $('orderUI').hidden = false; show('orders'); };

/* ---------- orders board ---------- */
var oFilter = 'active';
$('oDate').value = ymd(new Date());
$('oDate').onchange = loadOrders;
$('oRefresh').onclick = loadOrders;
$('oFilter').onclick = function(e){
  var f = e.target.dataset && e.target.dataset.f; if (!f) return;
  oFilter = f;
  document.querySelectorAll('#oFilter button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.f === f)); });
  loadOrders();
};
var NEXT = { New:'Preparing', Preparing:'Ready', Ready:'Completed' };
var NEXT_LABEL = { New:'Start preparing', Preparing:'Mark ready', Ready:'Complete' };
var lastOrders = [];
function loadOrders(quiet){
  var box = $('oList');
  if (!quiet){ box.innerHTML = ''; box.appendChild(loading()); }
  var status = oFilter === 'active' ? 'New,Preparing,Ready' : oFilter === 'all' ? '' : oFilter;
  return call('orders', { date: $('oDate').value || ymd(new Date()), status: status, detail: true }).then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Could not load orders');
    lastOrders = r.orders; renderOrders();
    if ($('oDate').value === ymd(new Date())) setCount(oFilter === 'active' ? r.orders.length : null);
  }).catch(function(e){ if (!quiet){ box.innerHTML = ''; box.appendChild(el('p','empty','Couldn’t load orders: ' + (e.message || e))); } });
}
function renderOrders(){
  var box = $('oList'); box.innerHTML = '';
  if (!lastOrders.length){ box.appendChild(el('p','empty', oFilter === 'active' ? 'No open orders right now.' : 'No orders for this filter.')); return; }
  var grid = el('div','cards');
  lastOrders.slice().sort(function(a,b){ return oFilter === 'active' ? a.createdAt.localeCompare(b.createdAt) : b.createdAt.localeCompare(a.createdAt); })
  .forEach(function(o){
    var c = el('article','ocard s-' + o.status);
    var top = el('div','top'); var left = el('div','');
    left.appendChild(el('div','who', o.customer || 'Walk-in'));
    left.appendChild(el('div','meta', timeOf(o.createdAt) + ' · ' + o.type));
    top.appendChild(left); top.appendChild(el('span','pill s-' + o.status, o.status));
    c.appendChild(top);
    var ul = el('ul');
    (o.items || []).forEach(function(it){ var li = el('li'); li.appendChild(el('span','q', it.qty + '×')); li.appendChild(el('span','', it.item)); if (it.note){ li.appendChild(document.createTextNode(' ')); li.appendChild(el('small','', '(' + it.note + ')')); } ul.appendChild(li); });
    c.appendChild(ul);
    if (o.notes) c.appendChild(el('div','meta','Note: ' + o.notes));
    var meta = el('div','meta'); meta.appendChild(el('span','oid',o.id));
    if (o.total !== null) meta.appendChild(document.createTextNode(' · ' + money(o.total)));
    if (o.source && o.source !== 'Website') meta.appendChild(document.createTextNode(' · ' + o.source));
    c.appendChild(meta);
    if ((o.constituents || []).length){
      var d = el('details'); d.appendChild(el('summary','','Ingredients used (' + o.constituents.length + ')'));
      var t = el('table'); var tb = el('tbody');
      o.constituents.forEach(function(x){ var tr = el('tr'); tr.appendChild(el('td','',x.material)); tr.appendChild(el('td','num',num(x.total) + ' ' + x.unit)); tb.appendChild(tr); });
      t.appendChild(tb); d.appendChild(t); c.appendChild(d);
    }
    var act = el('div','actions');
    if (NEXT[o.status]){
      var nb = el('button','btn primary',NEXT_LABEL[o.status]); nb.type='button';
      nb.onclick = function(){ setStatus(o, NEXT[o.status], nb); };
      act.appendChild(nb);
    }
    if (o.status !== 'Completed' && o.status !== 'Cancelled'){
      var cb = el('button','btn','Cancel'); cb.type='button'; var armed = false;
      cb.onclick = function(){
        if (!armed){ armed = true; cb.textContent = 'Tap again to cancel'; setTimeout(function(){ armed = false; cb.textContent = 'Cancel'; }, 3000); return; }
        setStatus(o, 'Cancelled', cb);
      };
      act.appendChild(cb);
    }
    if (o.status === 'Cancelled'){
      var rb = el('button','btn','Restore'); rb.type='button'; rb.onclick = function(){ setStatus(o, 'New', rb); }; act.appendChild(rb);
    }
    if (act.children.length) c.appendChild(act);
    grid.appendChild(c);
  });
  box.appendChild(grid);
}
function setStatus(o, status, btn){
  btn.disabled = true;
  call('updateStatus', { id:o.id, status:status }).then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Not updated');
    toast(o.id + ' → ' + status);
    return loadOrders(true);
  }).catch(function(e){ btn.disabled = false; toast('Not updated: ' + (e.message || e)); });
}
function setCount(n){ var c = $('activeCount'); if (n === null) return; c.textContent = String(n); c.hidden = !n; }
function refreshCount(){
  call('orders', { date: ymd(new Date()), status:'New,Preparing,Ready' }).then(function(r){ if (r && r.ok) setCount(r.count); }).catch(function(){});
}
setInterval(function(){
  if (document.hidden) return;
  if (view === 'orders') loadOrders(true); else refreshCount();
}, 20000);

/* ---------- ingredient usage ---------- */
var lastUsage = null;
function setRange(back){
  var to = new Date(), from = new Date();
  if (back === 1){ to.setDate(to.getDate()-1); from.setDate(from.getDate()-1); }
  if (back === 7){ from.setDate(from.getDate()-6); }
  $('uFrom').value = ymd(from); $('uTo').value = ymd(to);
}
setRange(0);
$('uQuick').onclick = function(e){ var q = e.target.dataset && e.target.dataset.q; if (q === undefined) return; setRange(Number(q)); loadUsage(); };
$('uFrom').onchange = loadUsage; $('uTo').onchange = loadUsage;
function loadUsage(){
  var box = $('uBody'); box.innerHTML = ''; box.appendChild(loading());
  var from = $('uFrom').value, to = $('uTo').value;
  if (from > to){ var t = from; from = to; to = t; $('uFrom').value = from; $('uTo').value = to; }
  call('usage', { from: from, to: to }).then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Could not load usage');
    lastUsage = r; renderUsage();
  }).catch(function(e){ box.innerHTML = ''; box.appendChild(el('p','empty','Couldn’t load usage: ' + (e.message || e))); });
}
function renderUsage(){
  var r = lastUsage, box = $('uBody'); box.innerHTML = '';
  var stats = el('div','stats');
  [[r.orders,'orders'],[r.items.reduce(function(s,i){ return s + i.qty; },0),'items sold'],[r.materials.length,'ingredients used']].forEach(function(s){
    var d = el('div','stat'); d.appendChild(el('b','',String(s[0]))); d.appendChild(el('span','',s[1])); stats.appendChild(d);
  });
  box.appendChild(stats);
  if (!r.orders){ box.appendChild(el('p','empty','No orders in these dates. Cancelled orders are not counted.')); return; }
  var two = el('div','two');
  var a = el('div'); a.appendChild(el('h3','','Items sold'));
  var wa = el('div','tablewrap'); var ta = el('table'); ta.innerHTML = '<thead><tr><th>Item</th><th class="num">Qty</th></tr></thead>';
  var tba = el('tbody'); r.items.forEach(function(i){ var tr = el('tr'); tr.appendChild(el('td','',i.item)); tr.appendChild(el('td','num',String(i.qty))); tba.appendChild(tr); });
  ta.appendChild(tba); wa.appendChild(ta); a.appendChild(wa);
  var b = el('div'); b.appendChild(el('h3','','Ingredients used'));
  var wb = el('div','tablewrap'); var tb = el('table'); tb.innerHTML = '<thead><tr><th>Ingredient</th><th>ID</th><th class="num">Used</th><th>Unit</th></tr></thead>';
  var tbb = el('tbody'), cat = null;
  r.materials.forEach(function(m){
    if (m.category !== cat){ cat = m.category; var g = el('tr','group'); var gd = el('td','',cat || 'Other'); gd.colSpan = 4; g.appendChild(gd); tbb.appendChild(g); }
    var tr = el('tr'); tr.appendChild(el('td','',m.material)); tr.appendChild(el('td','muted',m.materialId)); tr.appendChild(el('td','num',num(m.total))); tr.appendChild(el('td','',m.unit)); tbb.appendChild(tr);
  });
  tb.appendChild(tbb); wb.appendChild(tb); b.appendChild(wb);
  two.appendChild(a); two.appendChild(b); box.appendChild(two);
}
$('uCopy').onclick = function(){
  if (!lastUsage) return;
  var q = function(s){ s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  var csv = ['Material ID,Ingredient,Category,Used,Unit'].concat(lastUsage.materials.map(function(m){ return [m.materialId, m.material, m.category, num(m.total), m.unit].map(q).join(','); })).join('\n');
  var done = function(){ toast('Copied ' + lastUsage.materials.length + ' rows'); };
  if (navigator.clipboard) navigator.clipboard.writeText(csv).then(done).catch(function(){ fallbackCopy(csv); done(); });
  else { fallbackCopy(csv); done(); }
};
function fallbackCopy(text){ var t = el('textarea'); t.value = text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); }

/* ---------- connecting (only outside Apps Script) ---------- */
function showConnect(msg){
  $('menuLoading').hidden = true; $('orderUI').hidden = true; $('connectUI').hidden = false; $('mobileBar').hidden = true;
  $('cUrl').value = CONFIG.API_URL || ''; $('cErr').hidden = !msg; $('cErr').textContent = msg || '';
}
$('connectUI').onsubmit = function(e){
  e.preventDefault();
  var url = $('cUrl').value.trim(), key = $('cKey').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ $('cErr').textContent = 'Use the Web app URL from Apps Script (it ends in /exec).'; $('cErr').hidden = false; return; }
  CONFIG.API_URL = url; CONFIG.API_KEY = key; $('cBtn').disabled = true; $('cErr').hidden = true;
  call('menu').then(function(r){
    if (!r || !r.ok) throw new Error(r && r.error || 'Not connected');
    try{ localStorage.setItem(STORE, JSON.stringify({ API_URL:url, API_KEY:key })); }catch(err){}
    location.reload();
  }).catch(function(err){ $('cErr').textContent = 'Couldn’t connect: ' + (err.message || err); $('cErr').hidden = false; $('cBtn').disabled = false; });
};
$('disconnectBtn').hidden = IN_GAS || !savedConn().API_URL;
var discArm = false;
$('disconnectBtn').onclick = function(){
  if (!discArm){ discArm = true; $('disconnectBtn').textContent = 'Tap again to disconnect'; setTimeout(function(){ discArm = false; $('disconnectBtn').textContent = 'Disconnect this device'; }, 3000); return; }
  try{ localStorage.removeItem(STORE); }catch(e){}
  location.reload();
};

/* ---------- start ---------- */
$('today').textContent = new Date().toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
if (!IN_GAS && !CONFIG.API_URL) showConnect();
else { loadMenu(); refreshCount(); }
})();
</script>
